---
layout: compress
---
{% include base_path %}
<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    {% include head/custom.html %}
    <script src="{{ '/assets/js/home.js' | relative_url }}"></script>
    <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }} Feed">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="notebook">
      <header class="site-header">
        <a class="monogram" href="{{ '/' | relative_url }}" aria-label="Federico Di Gennaro — home">fdg<span aria-hidden="true">.</span></a>
        <nav aria-label="Main navigation">
          {% for link in site.data.navigation.main %}
            <a href="{{ link.url | relative_url }}"{% if link.url == page.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
          {% endfor %}
          <button class="theme-switch" type="button" aria-label="Switch to dark theme" hidden><span aria-hidden="true">◐</span></button>
        </nav>
      </header>
      <main id="main">{{ content }}</main>
      <footer class="site-footer">
        <span>© {{ site.time | date: '%Y' }} Federico Di Gennaro</span>
      </footer>
    </div>
    {% include analytics.html %}
  </body>
</html>
